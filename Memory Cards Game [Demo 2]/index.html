<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">  
  <title>Memory Card Game</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="wrapper">

    <ul class="cards">

      <!-- Pair 1 -->
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg" alt="icon"></div>
        <div class="view back-view"><img src="images/img_1.png"><span class="card-number">0</span></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_1.png"><span class="card-number">3</span></div>
      </li>

      <!-- Pair 2 -->
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_2.png"><span class="card-number">0</span></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_2.png"><span class="card-number">8</span></div>
      </li>

      <!-- Pair 3 -->
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_3.png"><span class="card-number">1</span></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_3.png"><span class="card-number">2</span></div>
      </li>

      <!-- Pair 4 -->
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_4.png"><span class="card-number">0</span></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_4.png"><span class="card-number">4</span></div>
      </li>

      <!-- Pair 5 -->
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_5.png"><span class="card-number">1</span></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_5.png"><span class="card-number">3</span></div>
      </li>

      <!-- Pair 6 -->
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_6.png"><span class="card-number">1</span></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_6.png"><span class="card-number">8</span></div>
      </li>

      <!-- Pair 7 -->
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_7.png"><span class="card-number">0</span></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_7.png"><span class="card-number">8</span></div>
      </li>

      <!-- Pair 8 -->
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_8.png"><span class="card-number">1</span></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_8.png"><span class="card-number">4</span></div>
      </li>

      <!-- Pair 9 -->
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_9.png"><span class="card-number">1</span></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="images/que_icon.svg"></div>
        <div class="view back-view"><img src="images/img_9.png"><span class="card-number">3</span></div>
      </li>

    </ul>

    <!-- Game Details -->
    <div class="details">
      <p class="time">Time: <span><b>30</b>s</span></p>
      <p class="flips">Flips: <span><b>0</b></span></p>
      <button id="refresh-btn">Refresh</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
